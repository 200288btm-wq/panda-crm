meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: npm install && npm run build && cp -r node_modules dist/node_modules
  artifacts:
    dist: /

run:
  command: node /app/node_modules/vite/bin/vite.js preview --outDir /app --port 80 --host 0.0.0.0
  containerPort: 80
